name: dbt CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: Create dummy dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          saas_analytics:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: saas-analytics-project-512218
                dataset: analytics
          EOF

      - name: Run dbt parse
        run: |
          cd saas_analytics
          dbt parse